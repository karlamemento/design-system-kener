<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratorios Kener — Soluciones farmacéuticas de alta especialidad</title>
<meta name="description" content="Laboratorio farmacéutico mexicano desde 1960. Soluciones de alta especialidad para el sector hospitalario, con cumplimiento COFEPRIS.">
<link rel="icon" type="image/jpeg" href="img/favicon.jpg">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<!-- Orden importa: tokens/marca → estilos de la home -->
<link href="../css/kener-styles.css" rel="stylesheet">
<link href="../css/kener-motion.css" rel="stylesheet">
</head>
<body>
    <div class="container-xxl p-5">
        <form id="form-registro" class="k-card k-form form-login collapse  show" action="#" method="post" data-bs-parent="#contenedorFormularios"><!-- Se sustituye por shortcode de Contact Form 7 -->
            <div class="text-float-end"><a href="../index.html" class="btn btn-outline-primary rounded-pill px-4">Inicio <i class="bi bi-house-fill"></i></a></div>
            <div class="text-center">
                <a class="navbar-brand" href="../index.html"><img src="../img/logo/Logo Kener (2).svg" width="128px" height="auto" alt="Laboratorios Kener"></a>
                <h3 class="fs-3 my-3">Crea tu cuenta</h3>
                <p>Regístrate para acceder al contenido exclusivo para personal médico calificado.</p>
            </div>
                <div class="row g-3">
                  <div class="col-12"><label for="f-nombre">Nombre Completo</label><input id="f-nombre" class="form-control" type="text" autocomplete="name" placeholder="Dr. / Dra. Nombre Apellido" required></div>
                  <div class="col-md-6"><label for="f-cedula">Cédula profesional</label><input id="f-cedula" placeholder="eje. 612301" class="form-control" type="text" required></div>
                  <div class="col-md-6"><label for="f-esp">Especialidad</label><select id="f-esp" class="form-select"><option>Cardiología</option><option>Anestesiología</option><option>Infectología</option><option>Oncología</option><option>Medicina interna</option><option>Otra</option></select></div>
                  <div class="col-md-6"><label for="f-mail">Correo electrónico</label><input id="f-mail" class="form-control" placeholder="correo@example.com" type="email" autocomplete="email" required></div>
                  <div class="col-md-6"><label for="f-mail">Confirma tu electrónico</label><input id="f-mail" class="form-control" type="email" autocomplete="email" required></div>
                  <div class="col-md-12"><label for="f-mail">Contraseña</label><input id="f-mail" class="form-control" type="password" autocomplete="email" required><small>Debe tener mínimo 8 caracteres, mayúsculas, minúsculas y número.</small></div>
                  <div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" id="f-aviso" required><label class="form-check-label text-none" for="f-aviso">Certifico que soy profesional de la salud</label></div></div>
                  <div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" id="f-aviso" required><label class="form-check-label text-none" for="f-aviso">He leído y acepto el <a href="#" class="k-link">aviso de privacidad</a></label></div></div>
                  <div class="col-12 text-center"><button type="submit" class="btn btn-primary rounded-pill px-5">Registrarse</button><p class="small-news text-muted mt-3 mb-0">¿Ya tienes una cuenta? <a href="login.html" class="k-link">Inicia Sesión aquí</a></p></div>
                </div>
            </form>
    </div>
    
</body>
</html>
